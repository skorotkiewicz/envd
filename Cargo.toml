[package]
name    = "envd"
version = "0.1.6"
edition = "2024"

[[bin]]
name = "envd"
path = "src/bin/server.rs"

[[bin]]
name = "enve"
path = "src/bin/client.rs"

[dependencies]
tokio      = { version = "1", features = ["full"] }
axum       = { version = "0.8.9", features = ["json"] }
redis      = { version = "1.2.0", features = ["tokio-comp"] }
serde      = { version = "1", features = ["derive"] }
chrono     = { version = "0.4", features = ["serde"] }
sqlx       = { version = "0.8", features = ["runtime-tokio", "postgres", "sqlite", "macros", "chrono"] }
libsqlite3-sys = { version = "0.30", features = ["bundled"] }
serde_yaml = "0.9"
clap       = { version = "4", features = ["derive"] }
clap_complete = "4"
reqwest    = { version = "0.13.3", features = ["json", "blocking"] }
anyhow     = "1"
shellexpand = "3"
serde_json = "1"
dirs       = "6"
